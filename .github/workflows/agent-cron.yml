# Free scheduler for the hosted app: calls /api/cron every 3 hours so saved searches,
# AI analysis, tailoring and status monitoring keep running without your computer on.
# Set repository secrets APP_URL (e.g. https://jobpilot.vercel.app) and CRON_SECRET.
name: Job Pilot agent tick
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_AGENT_CRON != 'false' }}
    steps:
      - name: Call cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET secrets not set — skipping"; exit 0; fi
          curl -fsS -m 70 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron" | head -c 2000
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run typecheck && npm run lint && npx vitest run --exclude tests/worker*.test.ts --exclude tests/extension.test.ts && npm run build
